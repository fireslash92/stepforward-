<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#150f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Step Forward Stage</title>
<meta name="description" content="Live 3D party game: step forward if you have…">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700&display=swap">
<style>
  /* Layout: 3D stage fills the screen; a compact HUD sits on top, one bottom sheet holds the controls
     (docked to the right on landscape phones). The camera re-frames the stage into the space left free. */
  :root {
    --night: #150f2b;
    --night-2: #1f1640;
    --glass: rgba(24, 16, 50, 0.86);
    --glass-strong: rgba(30, 20, 62, 0.96);
    --edge: rgba(255, 255, 255, 0.10);
    --edge-strong: rgba(255, 255, 255, 0.18);
    --ink: #f6f1ff;
    --muted: #b3a6d6;
    --faint: #7d71a3;
    --marquee: #ffd23f;
    --marquee-ink: #241640;
    --go: #3fd08a;
    --go-ink: #082417;
    --stay: #ff6b8b;
    --stay-ink: #3a0d1a;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Rubik", "Segoe UI", system-ui, -apple-system, sans-serif;
    --gutter-l: max(14px, env(safe-area-inset-left, 0px));
    --gutter-r: max(14px, env(safe-area-inset-right, 0px));
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --kb: 0px;
    --sheet-w: min(380px, 46vw);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night);
    color: var(--ink);
    font: 15px/1.4 var(--body);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--marquee); outline-offset: 2px; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #app { position: fixed; inset: 0; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- name tags over the 3D characters ---------- */
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; will-change: transform; }
  .tag .nm { font: 600 12px/1 var(--body); padding: 4px 8px; border-radius: 999px; background: rgba(10, 6, 24, 0.74); max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .tag.me .nm { background: var(--marquee); color: var(--marquee-ink); }
  .tag .st { font: 400 10px/1 var(--display); letter-spacing: 0.05em; padding: 3px 6px; border-radius: 4px; }
  .tag .st:empty { display: none; }
  .tag .st.wait { color: var(--muted); background: rgba(10, 6, 24, 0.6); }
  .tag .st.ready { color: var(--go-ink); background: var(--go); }
  .tag .st.me { color: var(--marquee-ink); background: var(--marquee); }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(var(--safe-t) + 10px) var(--gutter-r) 0 var(--gutter-l);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; width: 100%; max-width: 720px; }
  .hud-bar { display: flex; align-items: center; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--edge);
    font-size: 12px; font-weight: 600; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  button.chip:active { transform: scale(0.97); }
  .chip .lbl { color: var(--muted); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
  .chip b { font: 400 14px var(--display); color: var(--marquee); letter-spacing: 0.08em; }
  .chip svg.i { width: 16px; height: 16px; color: var(--muted); }
  .spacer { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .live .dot { background: var(--go); box-shadow: 0 0 0 3px rgba(63, 208, 138, 0.2); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--glass); border: 1px solid var(--edge); padding: 0;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn[aria-pressed=false] { color: var(--faint); }

  .qcard {
    background: var(--glass); border: 1px solid var(--edge); border-radius: 18px;
    padding: 10px 16px 12px; text-align: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  .steps { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
  .steps span { display: inline-flex; align-items: center; gap: 6px; }
  .steps span + span::before { content: ""; width: 14px; height: 1px; background: var(--edge-strong); }
  .steps .on { color: var(--marquee); }
  .steps .done { color: var(--muted); }
  #q { margin: 6px 0 2px; font: 400 clamp(18px, 5.4vw, 30px)/1.15 var(--display); color: var(--marquee); text-wrap: balance; overflow-wrap: anywhere; }
  #q .lead { display: block; font: 600 11px/1.2 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .meter { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin: 8px auto 2px; max-width: 320px; }
  .meter > div { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--go), #9ff0c6); transition: width 0.35s ease; }
  #sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  #sub b { color: var(--ink); font-weight: 600; }

  /* ---------- toasts ---------- */
  #toasts { position: absolute; left: 0; right: 0; top: var(--hud-bottom, 120px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 8px var(--gutter-r) 0 var(--gutter-l); }
  .toast { background: var(--glass-strong); border: 1px solid var(--edge-strong); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35); animation: toast-in 0.25s ease both; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast.out { animation: toast-out 0.3s ease both; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px) scale(0.97); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

  /* ---------- bottom sheet ---------- */
  .sheet {
    position: absolute; left: 0; right: 0; bottom: var(--kb);
    padding: 0 var(--gutter-r) calc(var(--safe-b) + 10px) var(--gutter-l);
    display: flex; justify-content: center; pointer-events: none;
    transition: bottom 0.15s ease;
  }
  .panel {
    pointer-events: auto;
    width: 100%; max-width: 560px; max-height: min(64vh, 560px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--glass-strong); border: 1px solid var(--edge); border-radius: 24px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .panel-head > div { min-width: 0; }
  .kicker { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .panel h2 { margin: 2px 0 0; font: 400 19px/1.2 var(--display); color: var(--ink); text-wrap: balance; }
  .head-actions { display: flex; gap: 6px; flex: none; }
  .ghost-btn { min-height: 36px; padding: 0 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .ghost-btn svg.i { width: 16px; height: 16px; }
  .ghost-btn.warn { background: rgba(255, 107, 139, 0.18); border-color: rgba(255, 107, 139, 0.5); color: #ffd0da; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .field input {
    width: 100%; height: 52px; padding: 0 14px; border-radius: 14px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge-strong);
    font-size: 17px; font-weight: 500;
  }
  .field input::placeholder { color: var(--faint); }
  .field input:focus { outline: none; border-color: var(--marquee); box-shadow: 0 0 0 3px rgba(255, 210, 63, 0.18); }

  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .role {
    text-align: left; padding: 14px; min-height: 104px; border-radius: 18px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--edge-strong);
  }
  .role .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(63, 208, 138, 0.16); color: var(--go); }
  .role.host .ico { background: rgba(255, 210, 63, 0.16); color: var(--marquee); }
  .role b { display: block; font: 400 17px/1.1 var(--display); }
  .role small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
  .role:not(:disabled):active { transform: scale(0.98); }
  .role.primary-role { background: linear-gradient(160deg, rgba(63, 208, 138, 0.22), rgba(63, 208, 138, 0.06)); border-color: rgba(63, 208, 138, 0.45); }
  .role:disabled { opacity: 0.45; }

  .lobby-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .links { display: flex; gap: 14px; flex: none; }
  .link { background: none; border: 0; padding: 6px 0; min-height: 32px; color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0; padding: 0 0 2px; scroll-snap-type: x proximity; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; scroll-snap-align: start; height: 36px; padding: 0 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); font-size: 13px; white-space: nowrap; max-width: 78%; overflow: hidden; text-overflow: ellipsis; }
  .chips button.picked { background: rgba(255, 210, 63, 0.16); border-color: rgba(255, 210, 63, 0.55); color: var(--marquee); }
  .chips button.shuffle { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .chips button.shuffle svg.i { width: 15px; height: 15px; }

  .primary {
    height: 58px; width: 100%; border-radius: 16px; border: 0;
    background: var(--marquee); color: var(--marquee-ink);
    font: 400 17px var(--display); letter-spacing: 0.02em;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(255, 210, 63, 0.25);
  }
  .primary:not(:disabled):active { transform: scale(0.985); }
  .primary:disabled { opacity: 0.45; box-shadow: none; }
  .primary .count { font: 600 13px var(--body); padding: 3px 8px; border-radius: 999px; background: rgba(36, 22, 64, 0.14); font-variant-numeric: tabular-nums; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border-radius: 14px; padding: 10px 8px; text-align: center; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--edge); }
  .stat b { display: block; font: 400 26px/1 var(--display); font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .stat.go b { color: var(--go); }
  .stat.stay b { color: var(--stay); }
  .names { margin: 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .names b { color: var(--ink); font-weight: 600; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    height: clamp(96px, 17vh, 132px); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font: 400 18px/1.1 var(--display); letter-spacing: 0.02em; text-align: center; padding: 8px;
    border: 2px solid transparent; position: relative;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .choice svg.i { width: 30px; height: 30px; stroke-width: 2.4; }
  .choice.fwd { background: rgba(63, 208, 138, 0.14); border-color: rgba(63, 208, 138, 0.45); color: #c9f7df; }
  .choice.stay { background: rgba(255, 107, 139, 0.12); border-color: rgba(255, 107, 139, 0.42); color: #ffd3dd; }
  .choice:active { transform: scale(0.97); }
  .choice.fwd[aria-pressed=true] { background: var(--go); color: var(--go-ink); border-color: var(--go); }
  .choice.stay[aria-pressed=true] { background: var(--stay); color: var(--stay-ink); border-color: var(--stay); }
  .choice[aria-pressed=true]::after { content: "✓"; position: absolute; top: 8px; right: 12px; font: 700 16px var(--body); }
  .choices.dim .choice[aria-pressed=false] { opacity: 0.55; }

  .waitcard { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.04); border: 1px dashed var(--edge-strong); }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--marquee); flex: none; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 63, 0.5); } 50% { box-shadow: 0 0 0 8px rgba(255, 210, 63, 0); } }
  .result { text-align: center; padding: 6px 0 2px; }
  .result .big { font: 400 26px/1.1 var(--display); }
  .result .big.go { color: var(--go); }
  .result .big.stay { color: var(--stay); }
  .result p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

  /* ---------- small phones ---------- */
  @media (max-width: 360px) {
    .roles { grid-template-columns: 1fr; }
    .role { min-height: 76px; flex-direction: row; align-items: center; justify-content: flex-start; }
    .chip .lbl { display: none; }
  }

  /* ---------- landscape phones: dock the sheet on the right ---------- */
  @media (orientation: landscape) and (max-height: 560px) {
    .hud { right: var(--sheet-w); padding-right: 10px; }
    .qcard { padding: 8px 12px 10px; }
    #q { font-size: clamp(16px, 3.4vw, 22px); }
    .meter { margin-top: 6px; }
    .sheet { top: 0; bottom: 0; left: auto; width: var(--sheet-w); align-items: stretch; padding: calc(var(--safe-t) + 10px) var(--gutter-r) calc(var(--safe-b) + 10px) 0; }
    .panel { max-height: none; height: 100%; border-radius: 20px; gap: 12px; padding: 14px; }
    .roles { grid-template-columns: 1fr; }
    .role { min-height: 56px; padding: 10px 12px; flex-direction: row; align-items: center; justify-content: flex-start; }
    .role .ico { width: 30px; height: 30px; }
    .field input { height: 44px; }
    .panel h2 { font-size: 17px; }
    .lobby-foot .hint { display: none; }
    .primary { height: 52px; }
    .choice { height: auto; flex: 1; min-height: 84px; }
    .choices { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="scene" aria-label="3D stage with the players"></canvas>
  <div id="tags" aria-hidden="true"></div>

  <header class="hud" id="hud">
    <div class="hud-bar">
      <button class="chip" id="roomChip" aria-label="Invite friends to this room">
        <span class="lbl">Room</span><b id="roomCode">----</b>
        <svg class="i" viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/></svg>
      </button>
      <div class="chip" id="conn" role="status"><span class="dot"></span><span id="connText">Connecting…</span></div>
      <span class="spacer"></span>
      <button class="icon-btn" id="muteBtn" aria-pressed="true" aria-label="Sound">
        <svg class="i" id="icoSound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="i" id="icoMute" viewBox="0 0 24 24" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
      </button>
    </div>
    <div class="qcard" aria-live="polite">
      <div class="steps" id="steps"><span data-s="waiting">Ask</span><span data-s="answering">Decide</span><span data-s="reveal">Reveal</span></div>
      <h1 id="q"><span class="lead">Step forward if you have…</span><span id="qText">…anything at all</span></h1>
      <div class="meter" id="meter" hidden><div id="meterFill"></div></div>
      <p id="sub">Pick a name, then play or host.</p>
    </div>
  </header>

  <div id="toasts" aria-live="polite"></div>

  <div class="sheet" id="sheet">
    <!-- lobby -->
    <section class="panel" id="lobby">
      <div class="panel-head">
        <div><div class="kicker">Party game</div><h2>Join the stage</h2></div>
      </div>
      <label class="field"><span>Your name</span>
        <input type="text" id="nameIn" maxlength="16" autocomplete="nickname" enterkeyhint="done" placeholder="e.g. Maya">
      </label>
      <div class="roles">
        <button class="role primary-role" id="joinBtn">
          <span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></span>
          <span><b>Play</b><small>Step forward or stay</small></span>
        </button>
        <button class="role host" id="qmBtn">
          <span class="ico"><svg class="i" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span>
          <span><b>Host</b><small id="qmBtnSub">Ask the questions</small></span>
        </button>
      </div>
      <div class="lobby-foot">
        <p class="hint" id="lobbyNote">Everyone with your invite link plays together.</p>
        <div class="links"><button class="link" id="newRoomBtn">New room</button><button class="link" id="practiceBtn">Practice with bots</button></div>
      </div>
    </section>

    <!-- question master -->
    <section class="panel" id="qmPanel" hidden>
      <div class="panel-head">
        <div><div class="kicker" id="qmKicker">You're the host</div><h2 id="qmTitle">Ask the room</h2></div>
        <div class="head-actions">
          <button class="ghost-btn" id="qmInvite"><svg class="i" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>Invite</button>
          <button class="ghost-btn" id="qmLeave">Leave</button>
        </div>
      </div>
      <div id="qmAsk" class="field-group" style="display:flex;flex-direction:column;gap:10px">
        <label class="field"><span>Step forward if you have…</span>
          <input type="text" id="qIn" maxlength="120" enterkeyhint="send" placeholder="ever seen snow">
        </label>
        <div class="chips" id="sugg" role="list" aria-label="Question ideas"></div>
      </div>
      <div id="qmLive" hidden style="display:flex;flex-direction:column;gap:10px">
        <div class="stats">
          <div class="stat go"><b id="stFwd">0</b><span>Forward</span></div>
          <div class="stat stay"><b id="stStay">0</b><span>Stay</span></div>
          <div class="stat"><b id="stWait">0</b><span>Deciding</span></div>
        </div>
        <p class="names" id="qmNames"></p>
      </div>
      <button class="primary" id="qmAction">Ask a random one</button>
    </section>

    <!-- player -->
    <section class="panel" id="playerPanel" hidden>
      <div class="panel-head">
        <div><div class="kicker" id="plKicker">On stage</div><h2 id="plTitle">Get ready</h2></div>
        <div class="head-actions"><button class="ghost-btn" id="playerLeave">Leave</button></div>
      </div>
      <div class="waitcard" id="plWait"><span class="pulse"></span><p class="hint" id="plWaitText">Waiting for the host to ask.</p></div>
      <div class="choices" id="choices" hidden>
        <button class="choice fwd" id="fwdBtn" aria-pressed="false">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>Step forward
        </button>
        <button class="choice stay" id="stayBtn" aria-pressed="false">

  function peersNow() {
    if (practice) {
      return [{ peer: "0-me", sameTab: true, presence: mine }]
        .concat(bots.map((b) => ({ peer: b.peer, sameTab: false, presence: b.p })));
    }
    if (!room || roomDead) return [];
    return room.peers();
  }

  function derive() {
    const ps = peersNow().filter((p) => p.kind !== "agent");
    const pres = (p) => (p.sameTab ? mine : (p.presence || {}));
    const byPeer = (a, b) => (a.peer < b.peer ? -1 : a.peer > b.peer ? 1 : 0);
    const qms = ps.filter((p) => pres(p).role === "qm").sort(byPeer);
    const mineQm = qms.find((p) => p.sameTab);
    const qmP = qms[0] || null;
    let game = null;
    if (qmP) {
      const q = pres(qmP);
      game = {
        phase: ["waiting", "answering", "reveal"].includes(q.phase) ? q.phase : "waiting",
        question: String(q.question || "").replace(/[\u0000-\u001f]/g, "").slice(0, 120),
        round: q.round || 0,
        name: clean(q.name, "Question Master"),
        isMe: !!qmP.sameTab,
      };
    }
    const players = ps.filter((p) => pres(p).role === "player").sort(byPeer).map((p) => {
      const pr = pres(p);
      const ok = game && pr.round === game.round && (pr.choice === 0 || pr.choice === 1);
      return { key: p.peer, name: clean(pr.name, "Player"), look: Math.abs(pr.look | 0) % 60, choice: ok ? pr.choice : -1, isMe: !!p.sameTab };
    });
    return { game, players, otherQm: qmP && !qmP.sameTab, blockedQm: !!mineQm && qmP !== mineQm };
  }

  const stripRole = (o) => { const r = {}; for (const [k, v] of Object.entries(o)) if (k !== "role" && v !== null && v !== undefined) r[k] = v; return r; };

  function pushMine() {
    if (!gameRef || roomDead) return;
    const playerRef = gameRef.child("players/" + ME), qmRef = gameRef.child("qm");
    const ownQm = fbQm && fbQm.owner === ME;
    if (mine.role === "player") {
      playerRef.set(stripRole(mine)).catch(onDbError);
      playerRef.onDisconnect().remove();
      if (ownQm) qmRef.remove().catch(() => {});
    } else if (mine.role === "qm") {
      const val = Object.assign(stripRole(mine), { owner: ME });
      qmRef.transaction((cur) => (cur && cur.owner && cur.owner !== ME ? undefined : val), (err, committed) => {
        if (err) { onDbError(err); return; }
        if (!committed && mine.role === "qm") { mine = {}; render(); return; }
        qmRef.onDisconnect().remove();
      });
      playerRef.remove().catch(() => {});
      playerRef.onDisconnect().cancel();
    } else {
      playerRef.remove().catch(() => {});
      playerRef.onDisconnect().cancel();
      if (ownQm) { qmRef.remove().catch(() => {}); qmRef.onDisconnect().cancel(); }
    }
  }

  function setMine(patch) {
    for (const [k, v] of Object.entries(patch)) { if (v === null) delete mine[k]; else mine[k] = v; }
    if (!practice) pushMine();
    render();
  }

  function onDbError(err) {
    console.warn(err);
    roomDead = true; live = false;
    deadReason = "The live database refused the connection. Check the Realtime Database rules in Firebase.";
    render();
  }

  const newCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; };

  function joinRoom(code) {
    if (gameRef) {
      const prev = mine.role; mine = {}; pushMine(); if (prev) render();
      gameRef.child("qm").off(); gameRef.child("players").off();
    }
    ROOM = code; fbQm = null; fbPlayers = {};
    try { history.replaceState(null, "", "#" + code); } catch (e) { location.hash = code; }
    $("roomCode").textContent = code;
    if (!db) { render(); return; }
    gameRef = db.ref("games/" + code);
    gameRef.child("qm").on("value", (s) => { fbQm = s.val(); render(); }, onDbError);
    gameRef.child("players").on("value", (s) => { fbPlayers = s.val() || {}; render(); }, onDbError);
    render();
  }
  const myName = () => {
    const n = clean($("nameIn").value, "");
    if (n) store.set("sf-name", n);
    return n || "Player " + (myLook % 90 + 10);
  };
  const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

  // ---------- sound on/off ----------
  document.addEventListener("pointerdown", () => sfx.unlock(), { passive: true });
  const syncMute = () => {
    const on = !sfx.muted;
    $("muteBtn").setAttribute("aria-pressed", String(on));
    $("muteBtn").setAttribute("aria-label", on ? "Sound on. Tap to mute" : "Sound off. Tap to unmute");
    $("icoSound").hidden = !on; $("icoMute").hidden = on;
  };
  $("muteBtn").addEventListener("click", () => { sfx.toggle(); syncMute(); });
  syncMute();

  // ---------- toasts ----------
  function toast(msg) {
    const box = $("toasts"), el = document.createElement("div");
    el.className = "toast"; el.textContent = msg; box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 320); }, 2400);
  }

  // ---------- sounds, haptics and toasts follow the shared game state ----------
  let prevSound = null, prevPlayers = null, prevHost = null;
  function soundHook(s) {
    const g = s.game;
    const cur = { phase: g ? g.phase : "none", round: g ? g.round : 0, n: s.players.length,
      decided: s.players.filter((p) => p.choice >= 0).length, fwd: s.players.filter((p) => p.choice === 1).length };
    const prev = prevSound; prevSound = cur;
    const names = new Map(s.players.map((p) => [p.key, p]));
    const host = g ? g.name : null;
    if (prev) {
      if (cur.phase === "answering" && (prev.phase !== "answering" || prev.round !== cur.round)) { sfx.play("ask"); buzz(12); }
      else if (cur.phase === "reveal" && prev.phase !== "reveal") { sfx.play("reveal", cur.fwd); buzz([20, 60, 30]); }
      else if (cur.phase === "waiting" && prev.phase === "reveal") sfx.play("whoosh");
      else if (cur.phase === "answering" && cur.decided > prev.decided) sfx.play("tick");
      if (cur.n > prev.n) sfx.play("pop");
      if (!practice && prevPlayers) {
        for (const [k, p] of names) if (!prevPlayers.has(k) && !p.isMe) toast(p.name + " joined");
        for (const [k, p] of prevPlayers) if (!names.has(k) && !p.isMe) toast(p.name + " left");
        if (host && host !== prevHost && !g.isMe) toast(host + " is hosting");
        if (!host && prevHost && mine.role === "player") toast(prevHost + " stopped hosting");
      }
    }
    prevPlayers = names; prevHost = host;
  }

  // ---------- question ideas ----------
  let suggestions = [];
  function reshuffle() {
    const pool = QUESTIONS.slice(); suggestions = [];
    while (suggestions.length < 5 && pool.length) suggestions.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    drawSugg();
  }
  function drawSugg() {
    const el = $("sugg"), cur = $("qIn").value.trim();
    el.replaceChildren();
    suggestions.forEach((q) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "listitem"); b.textContent = q;
      if (cur === q) b.className = "picked";
      b.addEventListener("click", () => { sfx.play("click"); $("qIn").value = q; drawSugg(); updateQmAction(); });
      el.appendChild(b);
    });
    const sh = document.createElement("button");
    sh.type = "button"; sh.className = "shuffle";
    sh.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>More ideas';
    sh.addEventListener("click", () => { sfx.play("click"); reshuffle(); });
    el.appendChild(sh);
  }

  // ---------- render ----------
  const PH = ["waiting", "answering", "reveal"];
  function setSteps(phase) {
    const j = PH.indexOf(phase);
    document.querySelectorAll("#steps span").forEach((el) => {
      const i = PH.indexOf(el.dataset.s);
      el.className = j < 0 ? "" : i === j ? "on" : i < j ? "done" : "";
    });
  }
  function setRich(el, parts) {
    el.replaceChildren();
    parts.forEach((p) => {
      if (typeof p === "string") el.appendChild(document.createTextNode(p));
      else { const b = document.createElement("b"); b.textContent = p.b; el.appendChild(b); }
    });
  }
  const list = (arr) => arr.map((p) => p.name).join(", ");

  let lastState = null;
  function render() {
    const s = derive(), g = s.game;
    lastState = s;
    phaseNow = g ? g.phase : "none";
    stageCount = s.players.length;

    syncStage(s.players.map((p) => {
      const forward = !!(g && g.phase === "reveal" && p.choice === 1);
      let st = "", cls = "";
      if (g && g.phase === "answering") { st = p.choice >= 0 ? "READY" : "…"; cls = p.choice >= 0 ? "ready" : "wait"; }
      else if (forward) { st = "ME!"; cls = "me"; }
      return Object.assign({}, p, { forward, st, cls });
    }));

    const n = s.players.length;
    const fwdP = s.players.filter((p) => p.choice === 1);
    const stayP = s.players.filter((p) => p.choice === 0);
    const waitP = s.players.filter((p) => p.choice < 0);
    const decided = n - waitP.length;
    const active = !!(g && g.question && g.phase !== "waiting");
    const role = mine.role || null;

    // ----- HUD -----
    setSteps(g ? g.phase : "none");
    $("qText").textContent = active ? g.question
      : !g ? "Waiting for a host"
      : g.isMe ? "Your question goes here" : "Next question coming up";
    $("meter").hidden = !(g && g.phase === "answering");
    $("meterFill").style.width = (n ? Math.round(decided / n * 100) : 0) + "%";
    const sub = $("sub");
    if (!g) setRich(sub, n ? [{ b: String(n) }, " on stage · someone needs to host"] : ["Pick a name, then play or host."]);
    else if (g.phase === "waiting") setRich(sub, g.isMe ? (n ? [{ b: String(n) }, " on stage · pick a question below"] : ["Invite friends to fill the stage"]) : [{ b: g.name }, " is choosing a question"]);
    else if (g.phase === "answering") setRich(sub, [{ b: decided + " of " + n }, " decided"]);
    else setRich(sub, [{ b: String(fwdP.length) }, " stepped forward · " + stayP.length + " stayed"]);
    drawBoard(active ? "Step forward if you have " + g.question : "Step forward if you have…");

    // ----- which sheet -----
    $("lobby").hidden = !!role;
    $("qmPanel").hidden = role !== "qm";
    $("playerPanel").hidden = role !== "player";

    // ----- lobby -----
    const canLive = !!room && !roomDead && live;
    $("joinBtn").disabled = !canLive;
    $("qmBtn").disabled = !canLive || !!s.otherQm;
    $("qmBtnSub").textContent = s.otherQm ? g.name + " is hosting" : "Ask the questions";
    let note;
    if (!room || roomDead) note = deadReason || "Live play is unavailable right now. Practice with bots instead.";
    else if (!live) note = "Connecting to the live stage…";
    else if (s.otherQm) note = g.name + " is hosting. Tap Play to join in.";
    else if (n === 0) note = "Tap the room code at the top to invite friends.";
    else note = n + " on stage and nobody is hosting yet.";
    $("lobbyNote").textContent = note;

    // ----- host -----
    if (role === "qm") {
      const ph = g && g.isMe ? g.phase : "waiting";
      $("qmTitle").textContent = s.blockedQm ? "Someone else is hosting" : ph === "waiting" ? "Ask the room" : ph === "answering" ? "Waiting for answers" : "The reveal";
      $("qmAsk").hidden = ph !== "waiting";
      $("qmLive").hidden = ph === "waiting";
      $("stFwd").textContent = fwdP.length; $("stStay").textContent = stayP.length; $("stWait").textContent = waitP.length;
      const nm = $("qmNames");
      if (s.blockedQm) setRich(nm, [{ b: g ? g.name : "Someone" }, " is already hosting this room."]);
      else if (ph === "answering") setRich(nm, n === 0 ? ["Nobody on stage yet."] : waitP.length ? ["Still deciding: ", { b: list(waitP) }] : ["Everyone has decided. Reveal when ready."]);
      else if (ph === "reveal") setRich(nm, fwdP.length ? ["Stepped forward: ", { b: list(fwdP) }] : ["Nobody stepped forward this time."]);
      updateQmAction();
    }

    // ----- player -----
    if (role === "player") {
      const ph = g ? g.phase : "none";
      const myPick = g && mine.round === g.round && (mine.choice === 0 || mine.choice === 1) ? mine.choice : null;
      $("plWait").hidden = !(ph === "none" || ph === "waiting");
      $("choices").hidden = ph !== "answering";
      $("plResult").hidden = ph !== "reveal";
      $("plTitle").textContent = ph === "none" ? "No host yet" : ph === "waiting" ? "Get ready" : ph === "answering" ? "Be honest!" : "Revealed";
      $("plWaitText").textContent = ph === "none" ? "Nobody is hosting. Tap Leave, then Host, to run the game." : g.name + " is choosing a question…";
      $("fwdBtn").setAttribute("aria-pressed", String(myPick === 1));
      $("stayBtn").setAttribute("aria-pressed", String(myPick === 0));
      $("choices").classList.toggle("dim", myPick !== null);
      const big = $("plResultBig");
      big.textContent = myPick === 1 ? "You stepped forward" : myPick === 0 ? "You stayed" : "You sat this one out";
      big.className = "big " + (myPick === 1 ? "go" : myPick === 0 ? "stay" : "");
      $("plResultSub").textContent = fwdP.length + " of " + n + " stepped forward";
      $("plHint").textContent = ph === "answering" ? (myPick === null ? "Your choice stays hidden until the reveal." : "Locked in. You can still switch before the reveal.") : ph === "reveal" ? "Next question coming up." : "";
      $("plHint").hidden = !$("plHint").textContent;
    }

    // ----- connection chip -----
    let ct;
    if (practice) ct = "Practice";
    else if (!room || roomDead) ct = "Offline";
    else if (!live) ct = "Connecting…";
    else { const here = room.peers().length; ct = here + (here === 1 ? " player" : " players"); }
    $("conn").classList.toggle("live", practice || canLive);
    $("connText").textContent = ct;
    $("roomChip").disabled = practice;

    soundHook(s);
    frame();
  }

  function updateQmAction() {
    const s = lastState;
    if (!s || mine.role !== "qm") return;
    const g = s.game, ph = g && g.isMe ? g.phase : "waiting";
    const btn = $("qmAction");
    btn.disabled = !!s.blockedQm;
    btn.replaceChildren();
    if (ph === "waiting") btn.textContent = $("qIn").value.trim() ? "Ask the room" : "Ask a random one";
    else if (ph === "answering") {
      const n = s.players.length, decided = s.players.filter((p) => p.choice >= 0).length;
      btn.appendChild(document.createTextNode("Reveal"));
      const c = document.createElement("span"); c.className = "count"; c.textContent = decided + "/" + n; btn.appendChild(c);
    } else btn.textContent = "Next question";
  }

  // ---------- actions ----------
  function joinStage() {
    sfx.play("click"); buzz(10);
    setMine({ role: "player", name: myName(), look: myLook, choice: null, round: null, phase: null, question: null });
  }
  function becomeQm() {
    sfx.play("click"); buzz(10);
    reshuffle();
    setMine({ role: "qm", name: myName(), look: myLook, phase: "waiting", question: "", round: Date.now(), choice: null });
  }
  function leave() {
    sfx.play("leave");
    if (practice) {
      practice = false; bots = []; botTimers.forEach(clearTimeout); botTimers = [];
      mine = {}; prevPlayers = null; render(); return;
    }
    setMine({ role: null, name: null, look: null, choice: null, round: null, phase: null, question: null });
  }
  let leaveArmed = null;
  function leaveClicked(btn) {
    const needConfirm = mine.role === "qm" && !practice && lastState && lastState.players.length > 0;
    if (needConfirm && leaveArmed !== btn) {
      leaveArmed = btn; btn.textContent = "Tap again to end"; btn.classList.add("warn"); buzz(15);
      setTimeout(() => { if (leaveArmed === btn) { leaveArmed = null; btn.textContent = "Leave"; btn.classList.remove("warn"); } }, 3000);
      return;
    }
    leaveArmed = null; btn.textContent = "Leave"; btn.classList.remove("warn");
    leave();
  }
  const randomQ = () => QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
  function ask() {
    let text = $("qIn").value.replace(/^\s*step forward if you have\s*/i, "").trim().slice(0, 120);
    if (!text) text = randomQ();
    $("qIn").value = ""; $("qIn").blur();
    const round = Date.now();
    setMine({ phase: "answering", question: text, round });
    if (practice) runBots(round);
  }
  function hostAction() {
    const s = lastState; if (!s) return;
    const g = s.game, ph = g && g.isMe ? g.phase : "waiting";
    if (ph === "waiting") ask();
    else if (ph === "answering") setMine({ phase: "reveal" });
    else { botTimers.forEach(clearTimeout); reshuffle(); setMine({ phase: "waiting", question: "" }); }
  }
  function choose(c) {
    const g = derive().game;
    if (!g || g.phase !== "answering") return;
    sfx.play("click"); buzz(15);
    setMine({ choice: c, round: g.round });
  }
  function invite() {
    if (practice) return;
    sfx.play("click");
    const url = location.href.split("#")[0] + "#" + ROOM;
    if (navigator.share) { navigator.share({ title: "Step Forward", text: "Join my Step Forward game, room " + ROOM, url }).catch(() => {}); return; }
    const fallback = () => window.prompt("Copy this invite link:", url);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast("Invite link copied"), fallback);
    else fallback();
  }

  // practice mode: you host, bots answer
  function startPractice() {
    sfx.play("click");
    practice = true; prevPlayers = null;
    reshuffle();
    mine = { role: "qm", name: myName(), look: myLook, phase: "waiting", question: "", round: 1 };
    bots = BOT_NAMES.map((name, i) => ({ peer: "b" + i, p: { role: "player", name, look: (myLook + 7 + i * 11) % 60, choice: null, round: null } }));
    render();
  }
  function runBots(round) {
    botTimers.forEach(clearTimeout); botTimers = [];
    bots.forEach((b) => {
      b.p = Object.assign({}, b.p, { choice: null, round: null });
      botTimers.push(setTimeout(() => {
        if (!practice || mine.round !== round) return;
        b.p = Object.assign({}, b.p, { choice: Math.random() < 0.5 ? 1 : 0, round });
        render();
      }, 700 + Math.random() * 3000));
    });
    render();
  }

  $("joinBtn").addEventListener("click", joinStage);
  $("qmBtn").addEventListener("click", becomeQm);
  $("practiceBtn").addEventListener("click", startPractice);
  $("qmLeave").addEventListener("click", (e) => leaveClicked(e.currentTarget));
  $("playerLeave").addEventListener("click", (e) => leaveClicked(e.currentTarget));
  $("qmAction").addEventListener("click", () => { sfx.play("click"); hostAction(); });
  $("qIn").addEventListener("input", () => { drawSugg(); updateQmAction(); });
  $("qIn").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("qmAction").disabled) { e.preventDefault(); hostAction(); } });
  $("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") e.currentTarget.blur(); });
  $("nameIn").addEventListener("change", () => { const n = myName(); if (mine.role) setMine({ name: n }); });
  $("fwdBtn").addEventListener("click", () => choose(1));
  $("stayBtn").addEventListener("click", () => choose(0));
  $("roomChip").addEventListener("click", invite);
  $("qmInvite").addEventListener("click", invite);

  reshuffle();
  render();
  if (document.fonts && document.fonts.load) {
    document.fonts.load("80px Bungee").then(() => { boardKey = null; drawFloor(); render(); }).catch(() => {});
  }

  // ---------- connect to Firebase ----------
  const fromHash = (location.hash || "").replace("#", "").toUpperCase();
  const startCode = /^[A-Z0-9]{4,8}$/.test(fromHash) ? fromHash : newCode();
  try {
    if (window.firebase && window.FIREBASE_CONFIG) {
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(window.FIREBASE_CONFIG);
      db = app.database();
      room = { peers: fbPeers };
      db.ref(".info/connected").on("value", (s) => {
        live = !!s.val();
        if (live && mine.role && !practice) pushMine();  // re-arm after reconnect
        render();
      });
    }
  } catch (e) { console.warn(e); room = null; deadReason = "Could not start the live connection."; }
  joinRoom(startCode);
  window.addEventListener("hashchange", () => {
    const c = (location.hash || "").replace("#", "").toUpperCase();
    if (/^[A-Z0-9]{4,8}$/.test(c) && c !== ROOM) joinRoom(c);
  });
  $("newRoomBtn").addEventListener("click", () => { sfx.play("click"); joinRoom(newCode()); toast("New room " + ROOM); });
})();
</script>
</body>
</html>
